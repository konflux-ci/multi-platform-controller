apiVersion: v1
kind: Service
metadata:
  name: multi-platform-otp-server
  namespace: multi-platform-controller
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
  selector:
    app.kubernetes.io/instance: multi-platform-otp-server
  sessionAffinity: None
  type: ClusterIP
