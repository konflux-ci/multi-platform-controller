codecov:
  require_ci_to_pass: true

ignore:
  - ".agents/**"
  - ".claude/**"
  - ".cursor/**"
  - "skills/**"
  - "docs/**"
  - "*.md"
  - "*.toml"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%
        informational: false

flags:
  unit-tests:
    carryforward: false
  e2e-tests:
    carryforward: true

comment:
  layout: "reach,diff,flags,files,footer"
  require_changes: true
