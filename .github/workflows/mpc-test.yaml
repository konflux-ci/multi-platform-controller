name: Validate PR - Testing Phase - golang CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the caller's context ref)
        type: string
        required: false
    secrets:
      # Only the secret the upload step uses; callers forward it explicitly
      # instead of secrets: inherit so no other repo secret reaches PR code.
      CODECOV_TOKEN:
        description: Codecov upload token
        required: false

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ main ]

  merge_group:
    types: [checks_requested]

  push:
    branches: [ main ]

# Keep runs of the same PR (or the same called run) from cancelling each other.
# For workflow_call runs inputs.ref is the PR head ref path
# (refs/pull/<n>/head), so different PRs never collide; standalone triggers
# keep their previous grouping.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  checkout_and_test:
    name: Golang Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Determine workflow run event context
        run: echo "on-event=${{ github.event_name }}" >> $GITHUB_ENV
      - name: Handle invalid context for pull requests
        if: ${{ env.on-event == 'pull_request' && (!github.event.pull_request.head.sha || !github.event.pull_request.number) }}
        run: |
          echo "Invalid context for this workflow run. Exiting."
          exit 1
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # When called via workflow_call (e.g. the /test command), test the
        # caller-provided ref instead of the default context. Empty for
        # standalone triggers, which keeps the default checkout.
        # persist-credentials: false applies on EVERY trigger path, not just
        # workflow_call: it is deliberate hardening so the checkout token
        # never lingers in the repo config while PR-controlled make targets
        # execute. No step after checkout needs git push/fetch credentials.
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "./go.mod"
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          files: cover.out
